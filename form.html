<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表單</title>
    <link
      href="https://cdn.jsdelivr.net/npm/reset-css@5.0.2/reset.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="heading-style.css" />
  </head>
  <body>
    <h1>表單</h1>
    <p>這段文字可以有 <strong>強調內容</strong>。</p>

    <form action="/register" method="post" id="regForm">
      <label for="user">使用者名稱:</label>
      <input
        type="text"
        id="user"
        name="username"
        required
        minlength="4"
        maxlength="10"
        size="12"
        placeholder="4-10個字元"
      /><br />

      <label for="pwd">密碼:</label>
      <input
        type="password"
        id="pwd"
        name="password"
        required
        pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
        title="至少包含大小寫字母和數字，且長度至少8位"
      /><br />

      <label for="age">年齡:</label>
      <input
        type="number"
        id="age"
        name="age"
        min="18"
        max="99"
        step="1"
      /><br />

      <label for="avatar">頭像:</label>
      <input
        type="file"
        id="avatar"
        name="avatar"
        accept="image/png, image/jpeg"
      /><br />

      <label>興趣:</label>
      <input type="checkbox" id="cb1" name="interests" value="coding" checked />
      <label for="cb1">寫程式</label>
      <input type="checkbox" id="cb2" name="interests" value="music" />
      <label for="cb2">聽音樂</label><br />

      <label>性別:</label>
      <input type="radio" id="male" name="gender" value="M" required />
      <label for="male">男</label>
      <input type="radio" id="female" name="gender" value="F" />
      <label for="female">女</label><br />

      <input type="hidden" name="source" value="web" />

      <input list="browsers" name="browser" />
      <datalist id="browsers">
        <option value="Chrome"></option>
        <option value="Firefox"></option>
        <option value="Safari"></option></datalist
      ><br />

      <label for="color">我的皮膚顏色</label>
      <input type="color" id="color" />

      <input type="submit" value="註冊" />
      <input type="reset" value="重設" />
    </form>
  </body>
</html>
